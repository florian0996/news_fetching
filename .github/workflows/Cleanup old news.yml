name: Cleanup old news files

on:
  schedule:
    # runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove and commit deletion of old news JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Delete news_*.json older than 7 days by filename date
        id: delete
        run: |
          TARGET_DIR=data
          echo "Scanning $TARGET_DIR for old news files based on filename date..."
          NOW=$(date +%s)
          THRESHOLD=$(date -d '7 days ago' +%s)
          DELETIONS=0
          for f in "$TARGET_DIR"/news_*.json; do
            [ -e "$f" ] || continue
            d=$(basename "$f" .json)
            DATE_STR=${d#news_}
            # parse YYYY-MM-DD from filename
            FILE_TS=$(date -d "$DATE_STR" +%s 2>/dev/null || echo 0)
            if [ "$FILE_TS" -gt 0 ] && [ "$FILE_TS" -lt "$THRESHOLD" ]; then
              echo "Deleting $f (date: $DATE_STR)"
              rm "$f"
              DELETIONS=$((DELETIONS + 1))
            fi
          done
          echo "deleted_count=$DELETIONS" >> $GITHUB_OUTPUT

      - name: Commit and push deletions
        if: steps.delete.outputs.deleted_count && steps.delete.outputs.deleted_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "cleanup: remove news files older than 7 days"
          git push
