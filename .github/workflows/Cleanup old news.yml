name: Cleanup old news files

on:
  schedule:
    # runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove and commit deletion of old news JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Delete news_*.json older than 7 days
        id: delete
        run: |
          TARGET_DIR=data
          echo "Looking in $TARGET_DIR for old news files..."
          # find and delete files older than 7 days
          DELETED=$(find "$TARGET_DIR" -maxdepth 1 -type f -name 'news_*.json' -mtime +7 -print -delete)
          echo "$DELETED"
          # export a flag if deletions occurred
          if [ -n "$DELETED" ]; then
            echo "deletions_occurred=true" >> $GITHUB_OUTPUT
          else
            echo "deletions_occurred=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push deletions
        if: steps.delete.outputs.deletions_occurred == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "cleanup: remove news files older than 7 days"
          git push
