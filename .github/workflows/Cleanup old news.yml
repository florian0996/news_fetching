name: Cleanup old news files

on:
  schedule:
    # runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove and commit deletion of old news JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Delete news_*.json older than 7 days
        run: |
          # adjust path to your data directory
          TARGET_DIR=news_fetching/data
          find "$TARGET_DIR" -maxdepth 1 -type f -name 'news_*.json' -mtime +7 -print -delete

      - name: Commit and push deletions
        if: ${{ steps.cleanup.outputs.deleted }} || true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_fetching/data
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "cleanup: remove news files older than 7 days"
            git push
          else
            echo "No files to delete."
          fi
