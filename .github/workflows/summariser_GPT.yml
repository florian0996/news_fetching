name: summarise with GPT

permissions:
  contents: write

on:
  # Allow manual triggers
  workflow_dispatch:
  # Run all summaries every day at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

jobs:
  summarise:
    runs-on: ubuntu-latest

    env:
     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai PyYAML pandas

      - name: Run daily summary
        run: |
          python scripts/create_summaries_GPT.py daily

      - name: Run weekly summary (Mondays only)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python scripts/create_summaries_GPT.py weekly
          else
            echo "Not Monday, skipping weekly summary."
          fi
          
      - name: Commit and push summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/summary_GPT_3.5.json
          # only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: daily/weekly summary"
            git push
          else
            echo "No changes to summary, skipping commit."
          fi
