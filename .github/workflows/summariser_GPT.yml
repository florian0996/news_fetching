name: summarise

on:
  # Allow manual triggers
  workflow_dispatch:
  # Run all summaries every day at 08:00 UTC
  schedule:
    - cron: '0 8 * * *'

jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily summary
        run: |
          python scripts/create_summaries_GPT.py --mode daily

      - name: Run weekly summary (Mondays only)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python scripts/create_summaries_GPT.py --mode weekly
          else
            echo "Not Monday, skipping weekly summary."
          fi
