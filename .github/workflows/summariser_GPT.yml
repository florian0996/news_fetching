name: Create GPT summaries (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a daily or weekly summary?"
        required: true
        default: "daily"
        type: choice
        options: [daily, weekly]

permissions:
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "openai>=1,<2"

      - name: Debug: show mode & file list
        run: |
          echo "⚙️ MODE = ${{ github.event.inputs.mode }}"
          echo "🗂️ Found news files count: $(ls -1 data/news_*.json | wc -l)"
          ls -1 data/news_*.json || echo "⚠️ No news files found"

      - name: Run chosen summary mode
        run: python scripts/create_summaries_GPT.py ${{ github.event.inputs.mode }}

      - name: Commit & push if changed
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name  "${{ github.actor }}"
          git add data/summary_GPT_3.5.json
          git diff --cached --quiet || git commit -m "bot: update ${{ github.event.inputs.mode }} summary"
          git push
