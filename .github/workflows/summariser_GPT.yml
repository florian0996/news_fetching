name: Create GPT summaries (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a daily or weekly summary?"
        required: true
        default: "daily"
        type: choice
        options: [daily, weekly]

jobs:
  summarise:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install "openai>=1,<2"

      - name: Run chosen summary mode
        run: python scripts/create_summaries_GPT.py ${{ github.event.inputs.mode }}

      - name: Commit & push if changed
        env:
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_NAME:  ${{ secrets.GH_NAME }}
        run: |
          git config --global user.email "$GH_EMAIL"
          git config --global user.name  "$GH_NAME"
          git add data/'summary GPT 3.5.json'
          git diff --cached --quiet || git commit -m "bot: update ${{ github.event.inputs.mode }} summary"
          git push
