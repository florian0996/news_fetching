name: Send Weekly Summaries to Teams

on:
  schedule:
    # Runs at 06:30 UTC every Monday
    - cron: "30 6 * * 1"
  workflow_dispatch:  # allows manual run

jobs:
  send-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: python scripts/send_weeklysummary.py
