name: Send Daily Summaries to Teams

on:
  schedule:
    # Runs at 06:30 UTC every day except Monday
    - cron: "30 6 * * 2-0"  # 2=Tuesday, 0=Sunday
  workflow_dispatch:        # allows manual run

jobs:
  send-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: python scripts/senddailysummary.py
