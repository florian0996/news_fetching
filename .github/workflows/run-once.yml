name: Run Entity Query Script

on:
  workflow_dispatch:

permissions:
  contents: write  # Required to push changes

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pandas
        run: pip install pandas

      - name: Run generate_entity_queries.py
        run: python scripts/generate_entity_queries.py

      - name: Commit and push generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/Entity_GNews_Queries.csv
          git commit -m "Add Entity_GNews_Queries.csv [auto-generated]" || echo "No changes to commit"
          git push
