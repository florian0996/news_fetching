name: Populate platforms_mentioned

permissions:
  contents: write

on:
  schedule:
    - cron: "15 3 * * *"   # daily at 03:15 UTC
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # 1) Merge dailies into quarterlies/all_news first
      - name: Merge into aggregate files
        run: |
          python scripts/merge_news.py

      # 2) Tag BOTH daily and quarterly files
      - name: Tag news articles (daily + quarterly)
        run: |
          python scripts/tag_platforms.py

      # 3) Build digest from quarterlies (now tagged)
      - name: Build daily company digest
        run: |
          python scripts/build_daily_company_digest.py

      # 4) Commit changes if any
      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # stage digest, daily, and aggregate files
          git add data/news_*.json data/news_filtered_for_companies_of_interest.json data/all_news.json

          if ! git diff --cached --quiet; then
            git commit -m "ci: tag platforms (daily+quarterly) & refresh digest"
            git push
          else
            echo "No changes to commit"
          fi
